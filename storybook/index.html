<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, interactive-widget=overlays-content, viewport-fit=cover, shrink-to-fit=no"
    />

    <title>Material Design 3 Expressive</title>

    <meta
      name="description"
      content="React component library implementing Material Design 3 Expressive patterns and themes."
    />

    <meta
      name="keywords"
      content="tomaschochola, TomasChochola, Tomas Chochola, Tomáš Chochola, accessibility, components, design-system, material-design, react"
    />

    <meta
      name="author"
      content="Tomáš Chochola <tomaschochola@tomaschochola.cz>"
    />

    <meta
      name="theme-color"
      content="#5b4497"
    />

    <meta
      name="apple-mobile-web-app-capable"
      content="yes"
    />

    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="default"
    />

    <meta
      name="apple-mobile-web-app-title"
      content="Expressive"
    />

    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
      crossorigin="anonymous"
    />

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin="anonymous"
    />

    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,1..1000&display=swap"
      crossorigin="anonymous"
    />

    <!-- webpackIgnore: true -->
    <link
      rel="icon"
      type="image/vnd.microsoft.icon"
      sizes="16x16 32x32 48x48"
      href="/favicon.ico"
    />

    <!-- webpackIgnore: true -->
    <link
      rel="icon"
      type="image/svg+xml"
      sizes="any"
      href="/favicon.svg"
    />

    <!-- webpackIgnore: true -->
    <link
      rel="icon"
      type="image/png"
      sizes="96x96"
      href="/favicon-96x96.png"
    />

    <!-- webpackIgnore: true -->
    <link
      rel="apple-touch-icon"
      type="image/png"
      sizes="180x180"
      href="/apple-touch-icon.png"
    />

    <!-- webpackIgnore: true -->
    <link
      rel="manifest"
      href="/manifest.webmanifest"
    />
  </head>
  <body></body>
</html>
